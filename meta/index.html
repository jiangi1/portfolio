<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Analysis - Isabella Jiang</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Codebase Analysis</h1>
    <p>Statistical analysis of my portfolio codebase.</p>
    
    <div id="stats" class="stats-container"></div>
    
    <h2>Commits by Time of Day</h2>
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    
    <h3>Language Breakdown for Selected Commits</h3>
    <dl id="language-breakdown" class="stats"></dl>
    
    <dl id="commit-tooltip" class="info tooltip" hidden></dl>
</body>
</html>
